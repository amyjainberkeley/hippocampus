[package]
name         = "mci-server"
version      = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description  = "MCI workspace server: Tier-2 encrypted brief store + enrollment. ADR-0019."

[lints]
workspace = true

[dependencies]
axum         = "0.8"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite     = { version = "0.39.0", features = ["bundled"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4", "serde"] }
async-trait  = "0.1"
thiserror    = "1"
tracing      = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# --- Crypto (ADR-0019 §4 — real AEAD + key wraps, replaces NoopKeyWrap stubs) ---
# All MIT/Apache-2.0 dual-licensed. CSO dep audit owed at PR review.
ring          = "0.17"
x25519-dalek  = { version = "2", features = ["getrandom", "static_secrets"] }
hkdf          = "0.12"
sha2          = "0.10"

[dev-dependencies]
tokio  = { version = "1", features = ["rt-multi-thread", "macros", "net", "test-util"] }
hyper  = { version = "1", features = ["full"] }
tower  = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

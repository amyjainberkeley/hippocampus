[package]
name                   = "mci-mail-reader"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: Mail.app read path (emlx splitter + Envelope Index + FSEvents) for V2-P8a. READ-ONLY library; no event emit, no brain write. See docs/research/mail-envelope-schema-2026-05-29.md."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Scope (V2-P8a — read path only)
# ---------------------------------------------------------------------------
# This crate ships the Mail.app READ surface only:
#   - discover_accounts()       → enumerate ~/Library/Mail/V<N>/<account-uuid>/
#   - list_recent_messages()    → Envelope Index SQLite read (WAL-aware, ro)
#   - read_message()            → emlx splitter → mail-parser → ParsedMessage
#   - watch_inbox()             → FSEvents-backed stream of new-emlx events
#
# It does NOT ingest, does NOT touch the brain, does NOT emit wire-level
# CaptureEvents. The cascade-equivalent + ADR-0030 §3(c)(ii) parsed-header
# check + corpus + allowlist edit ship in V2-P8b (CSO-gated).
#
# Lib body is gated `#![cfg(target_os = "macos")]`; on non-macOS targets the
# crate compiles as an empty library so `cargo build --workspace` is clean
# for Linux contributors. Same shape as `mci-embed-coreml` / `mci-llama-coreml`.

[dependencies]
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# RFC 5322 + MIME parser. Apache-2.0 / MIT, zero-copy, 100% safe Rust,
# MIRI-tested, used at scale by Stalwart Mail. Picked per the Mail-spike
# memo (docs/research/mail-envelope-schema-2026-05-29.md §6). Default
# features cover the RFC 5322 + MIME header/body surface V2-P8a needs.
mail-parser = "0.11"

# Apple plist (the emlx trailer is an XML <plist>). Pulled in here at the
# adapter, not in core. Default features include XML; we don't need binary
# plist for the emlx trailer (Mail.app writes XML) but cost is negligible.
plist       = "1.7"

# WAL-aware read-only opens against ~/Library/Mail/V<N>/MailData/Envelope Index.
# We do NOT enable `bundled-sqlcipher-vendored-openssl` — this adapter reads
# a plaintext SQLite file (Mail.app's; not our SQLCipher store). Default
# features only; rusqlite vendors a recent libsqlite3 (`bundled` feature)
# which we pick so the Mail.app DB read path is decoupled from the host's
# libsqlite3 (the system one may not have FTS5 etc., though we don't need it).
rusqlite    = { version = "0.39.0", features = ["bundled"] }

# FSEvents-backed cross-platform watcher. MIT/Apache-2.0. Default features
# pick the FSEvents backend on macOS. Used for the V<N> bump watch (top-level)
# and the per-mailbox recursive watch.
notify      = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

# Async stream surface for watch_inbox.
tokio        = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }
futures-core = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"
tokio    = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time", "test-util"] }

# ---------------------------------------------------------------------------
# CLI binary for manual verification.
# ---------------------------------------------------------------------------
# `mail-reader discover | list | read | watch`. Surfaces a one-line
# "Mail access denied — grant Full Disk Access" message on EPERM.
[[bin]]
name = "mail-reader"
path = "src/bin/mail_reader.rs"
required-features = []

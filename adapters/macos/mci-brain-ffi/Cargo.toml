[package]
name                   = "mci-brain-ffi"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: C-ABI FFI shim exposing read-only timeline and lexical or Core ML-backed hybrid recall, plus explicitly gated privacy deletion, to the Swift Recall app."

[lints]
workspace = true

[lib]
# staticlib so the Swift recall-ui app can link us via a system-library
# product.
# rlib is also produced so workspace cargo tests still link this crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
mci-brain  = { path = "../../../core/brain" }
mci-core   = { path = "../../../core" }
thiserror  = "1"
# serde_json is already on the workspace lockfile transitively
# (rusqlite → ... → serde_json). Declaring it here adds zero new
# third-party crates. The FFI surface returns JSON strings so the Swift
# side can decode them with `Codable` without a hand-rolled wire format.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Cycle 8.47 — `getrandom` for the wipe-confirmation token (32 random
# bytes hex-encoded). Already on the workspace lockfile via mci-core.
getrandom  = "0.3.4"
# Uses the same safe `flock(LOCK_EX | LOCK_NB)` writer lease as mci-agent.
# The process feature supplies the current uid for private-file validation.
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
mci-embed-coreml = { path = "../mci-embed-coreml" }

[dev-dependencies]
# Stub feature on mci-brain gives us NoopChunker / FixedDimEmbedder /
# InMemoryBrainStore / StubRetriever for headless tests. Same pattern
# mci-embed-coreml uses.
mci-brain  = { path = "../../../core/brain", features = ["stubs"] }
# Test-only access to mci-core's `InMemoryKeyWrap` for spinning up an
# ephemeral SQLCipher brain DB under a test key. Mirrors the gate
# mci-core uses for its own store-open tests; never in a shipped build.
mci-core   = { path = "../../../core", features = ["insecure-test-keywrap"] }
# Already on the workspace lockfile via mci-core dev-dependencies.
tempfile   = "3.27.0"
rusqlite   = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }

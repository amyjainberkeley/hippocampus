[package]
name                   = "mci-brain-ffi"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: C-ABI FFI shim that exposes a READ-ONLY view of the Phase-3 brain (events / search / privacy moments) to the Swift recall-ui app. Read-only by construction — see crate-level docs + ADR-0016 §4. P3.9a skeleton: signatures + stub bodies; P3.9b wires the real HybridRetriever + readonly SqlCipher open."

[lints]
workspace = true

[lib]
# staticlib so the Swift recall-ui app can link us via a binaryTarget /
# system-library product (P3.9b wires the Swift Package linker line).
# rlib is also produced so workspace cargo tests still link this crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
mci-brain  = { path = "../../../core/brain" }
mci-core   = { path = "../../../core" }
thiserror  = "1"
# serde_json is already on the workspace lockfile transitively
# (rusqlite → ... → serde_json). Declaring it here adds zero new
# third-party crates. The FFI surface returns JSON strings so the Swift
# side can decode them with `Codable` without a hand-rolled wire format.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Stub feature on mci-brain gives us NoopChunker / FixedDimEmbedder /
# InMemoryBrainStore / StubRetriever for headless tests. Same pattern
# mci-embed-coreml uses.
mci-brain  = { path = "../../../core/brain", features = ["stubs"] }

[package]
name                   = "mci-llama-coreml"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: Core ML backend for Qwen3-1.7B INT4 brief generation. Implements mci_brief::llama_backend::LlamaBackend. See docs/decisions/0028-brief-author-model-qwen3-1.7b-coreml.md."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Unsafe surface — adapter, NOT core
# ---------------------------------------------------------------------------
# This crate calls Apple's Core ML through `objc2-core-ml` / `objc2-foundation`,
# which expose Objective-C selectors via `unsafe fn`. The unsafe surface is
# audited per call site; `mci-brief` stays `#![forbid(unsafe_code)]`.
# Same adapter-below-the-seam split as `mci-embed-coreml`.

[dependencies]
mci-brief = { path = "../../../core/brief" }
thiserror = "1"

# serde_json: parse vocab.json for the BPE tokenizer. Already on the
# lockfile via the server crate. No net-new transitive crates — no
# ADR-0008 dep-addition gate triggered.
[target.'cfg(target_os = "macos")'.dependencies]
serde_json        = "1"
serde             = { version = "1", features = ["derive"] }
objc2             = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation  = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSValue",
    "NSObject",
    "NSArray",
    "NSDictionary",
    "NSData",
] }
objc2-core-ml     = { version = "0.3", default-features = false, features = [
    "std",
    "MLModel",
    "MLModelDescription",
    "MLFeatureDescription",
    "MLFeatureProvider",
    "MLFeatureValue",
    "MLFeatureType",
    "MLDictionaryFeatureProvider",
    "MLMultiArray",
    "MLModelConfiguration",
] }

[dev-dependencies]
mci-brief = { path = "../../../core/brief" }
tempfile  = "3"
serde_json = "1"

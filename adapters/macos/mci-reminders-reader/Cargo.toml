[package]
name                   = "mci-reminders-reader"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: Reminders.app read path (EventKit deep-hook) — Phase D SCAFFOLD ONLY, no reads wired. See docs/decisions/0037-deep-hook-plugins-calendar-notes-reminders-scaffold.md."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Scope (Phase D — scaffold only)
# ---------------------------------------------------------------------------
# Reminders shares EventKit with Calendar (EKReminder / EKEventStore) but
# requires a distinct Automation TCC per-target grant (Reminders, separate
# from Calendars). This crate ships the API shape only; wire-up in
# cycle 8.60+ via EventKit's `EKEventStore.requestFullAccessToReminders`.

[dependencies]
thiserror = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"

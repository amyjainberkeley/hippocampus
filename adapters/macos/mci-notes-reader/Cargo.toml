[package]
name                   = "mci-notes-reader"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: Notes.app read path (AppleScript automation deep-hook) — Phase D SCAFFOLD ONLY, no reads wired. See docs/decisions/0037-deep-hook-plugins-calendar-notes-reminders-scaffold.md."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Scope (Phase D — scaffold only)
# ---------------------------------------------------------------------------
# Notes.app has NO public framework surface (no EventKit / no chat.db /
# no emlx). Its bundle-internal database (`NoteStore.sqlite` under
# ~/Group Containers/group.com.apple.notes/) is undocumented and Apple
# reserves the right to break at any macOS point release. The supported
# path is AppleScript automation via `com.apple.Notes` — which the
# wire-up PR will implement, gated on the Automation TCC per-target grant
# for Notes.app.
#
# This crate ships the API shape only. Empty reads, no AppleScript engine
# pulled in.

[dependencies]
thiserror = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"

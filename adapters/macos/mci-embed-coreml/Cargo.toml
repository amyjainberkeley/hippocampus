[package]
name                   = "mci-embed-coreml"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS adapter: Core ML / ANE backend for the snowflake-arctic-embed-s embedder. Implements mci_brain::arctic_embed_s::EmbedderBackend. See docs/decisions/0011-embedding-model-snowflake-arctic-embed-s.md and docs/decisions/0016-phase-3-ocr-brain.md §1.3."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Unsafe surface — adapter, NOT core
# ---------------------------------------------------------------------------
# This crate calls Apple's Core ML through `objc2-core-ml` / `objc2-foundation`,
# which expose Objective-C selectors via `unsafe fn`. The unsafe surface is
# audited per call site; `mci-brain` stays `#![forbid(unsafe_code)]`.
# The Rust-side adapter mirrors `adapters/macos/MCICaptureHelper` (Swift)
# in carrying the OS-bound code below the ADR-0003 cross-platform seam.

# Always-on deps — used on every platform.
[dependencies]
mci-brain = { path = "../../../core/brain" }
thiserror = "1"

# macOS-only deps — objc2 / Core ML bindings. Gating here means a Linux
# `cargo build --workspace` does not download or compile them. Combined
# with `#![cfg(target_os = "macos")]` on the lib body, this crate is
# effectively empty on non-macOS targets (preserves workspace
# buildability for contributors who clone on Linux).
#
# Maintainer: `madsmtm/objc2` on GitHub. Active monorepo for the entire
# objc2 Apple-framework-bindings family. License: Zlib OR Apache-2.0 OR
# MIT — compatible with MCI's TBD-private workspace license.
#
# CSO supply-chain audit OWED on this PR per ADR-0008 / ADR-0014 standing
# rule for new dep additions. Net-new transitive crates (full enum):
#   - objc2 0.6.x          (FFI primitives)
#   - objc2-encode 4.x     (selector encoding)
#   - block2 0.6.x         (block trampolines)
#   - dispatch2 0.3.x      (GCD bindings, transitively pulled)
#   - objc2-foundation 0.3.x
#   - objc2-core-foundation 0.3.x
#   - objc2-core-ml 0.3.x
#   - objc2-core-graphics 0.3.x  (transitively required)
#   - objc2-core-video 0.3.x     (transitively required)
#   - objc2-image-io 0.3.x       (transitively required)
#   - objc2-metal 0.3.x          (transitively required)
#   - objc2-io-surface 0.3.x     (transitively required)
# Plus the existing `bitflags` and `libc` already on the lockfile.
#
# Features kept to the minimum set the loader + forward-pass code needs;
# default features OFF on both crates to keep the supply-chain surface
# tight (per ADR-0008 dep-addition gate).
[target.'cfg(target_os = "macos")'.dependencies]
objc2             = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation  = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSValue",
    "NSObject",
    "NSArray",
    "NSDictionary",
    "NSSet",
    "NSEnumerator",
    "NSData",
] }
objc2-core-ml     = { version = "0.3", default-features = false, features = [
    "std",
    "MLModel",
    "MLModelDescription",
    "MLFeatureDescription",
    "MLFeatureProvider",
    "MLFeatureValue",
    "MLFeatureType",
    "MLDictionaryFeatureProvider",
    "MLMultiArray",
    "MLModelConfiguration",
] }

[dev-dependencies]
mci-brain = { path = "../../../core/brain", features = ["stubs"] }

# MCI known-safe-apps allowlist v1
# CSO-ratified bundles. Cascade §1 source-level allow path activates per-bundle here.
# Each entry is a deliberate trust decision per ADR-0013 §3 + ADR-0015 §5 + ADR-0017 §3.1.
# User-mutable allowlist is v2+ (open question in ADR-0017 §3.1).

[[entries]]
bundle_id = "com.apple.Safari"
rationale = "Web browser. URL captured via P2.3 SafariURLProvider with Automation TCC; content via dirty-rect OCR. Safe to capture by default."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]
bundle_id = "com.apple.Terminal"
rationale = "Terminal.app. Cascade §3 secure-input detection (IsSecureEventInputEnabled) suppresses password entry. Other content safe."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]
bundle_id = "com.microsoft.VSCode"
rationale = "VS Code IDE. Code + text content; no inherent secure-input concerns. Cascade §4 backstop catches any AX-secure subroles."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]
bundle_id = "com.google.Chrome"
rationale = "Chrome browser. URL via P2.4 ChromiumURLProvider; same model as Safari."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]
bundle_id = "com.tinyspeck.slackmacgap"
rationale = "Slack desktop. Workplace messaging; OCR-captured. Cascade §4 + §6 OCR-time regex catch any embedded secrets."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]
bundle_id = "notion.id"
rationale = "Notion desktop. Document content."
cso_ratified_by = "orchestrator-seat"
ratified_at = "2026-05-20"

[[entries]]

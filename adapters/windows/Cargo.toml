[package]
name                   = "mci-windows-adapter"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI Windows adapter: Windows.Graphics.Capture + UI Automation + Media Foundation stubs. Implements core::capture::CaptureSource for Windows. Phase 8 scaffold — all methods stubbed; no Windows SDK calls yet. Deps + lib body gated by cfg(target_os = \"windows\") so cargo build --workspace on macOS/Linux compiles this as an empty library."

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Always-on deps — used on every platform (for the trait surface)
# ---------------------------------------------------------------------------
[dependencies]
mci-core    = { path = "../../core" }
async-trait = "0.1"
thiserror   = "1"
tokio       = { version = "1", features = ["sync"] }

# ---------------------------------------------------------------------------
# Windows-only deps — windows-rs bindings to WGC / Media Foundation / UIA.
# Gating here means a macOS/Linux `cargo build --workspace` does not
# download or compile them. Combined with `#[cfg(target_os = "windows")]`
# on the lib body, this crate is effectively empty on non-Windows targets.
#
# Maintainer: microsoft/windows-rs on GitHub. Official Microsoft bindings.
# License: MIT OR Apache-2.0.
#
# Features are the minimum set the Phase 8 scaffold needs; expanded as
# real implementations land.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Win32_UI_Accessibility",
    "Media_MediaProperties",
    "Media_Transcoding",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

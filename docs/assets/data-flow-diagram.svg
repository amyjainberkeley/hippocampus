<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="titleId descId" width="900" height="220">
  <title id="titleId">Hippocampus data flow: capture, encrypt, embed, recall</title>
  <desc id="descId">Four-node horizontal flow. Screen Capture feeds an Encrypt and Store stage, which feeds a Named-Entity Recognition and Semantic Embed stage, which feeds the Recall UI. All processing is on-device.</desc>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3D8060"/>
      <stop offset="100%" stop-color="#7AFFC1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7AFFC1"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="#0D0D0D"/>

  <!-- Node group style: rounded card, mint-dim border, mint accent text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-size="14" fill="#E0E0E0">

    <!-- Node 1: Screen Capture -->
    <g transform="translate(20,60)">
      <rect x="0" y="0" width="180" height="100" rx="12" ry="12" fill="#131313" stroke="#3D8060" stroke-width="1.5"/>
      <text x="90" y="28" text-anchor="middle" fill="#7AFFC1" font-size="11" letter-spacing="1.5">01 &#183; CAPTURE</text>
      <text x="90" y="56" text-anchor="middle" font-weight="600" font-size="15">Screen Capture</text>
      <text x="90" y="78" text-anchor="middle" fill="#999999" font-size="11">ScreenCaptureKit + OCR</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="205" y1="110" x2="235" y2="110" stroke="url(#edge)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 2: Encrypt & Store -->
    <g transform="translate(240,60)">
      <rect x="0" y="0" width="190" height="100" rx="12" ry="12" fill="#131313" stroke="#3D8060" stroke-width="1.5"/>
      <text x="95" y="28" text-anchor="middle" fill="#7AFFC1" font-size="11" letter-spacing="1.5">02 &#183; STORE</text>
      <text x="95" y="56" text-anchor="middle" font-weight="600" font-size="15">Encrypt &amp; Store</text>
      <text x="95" y="78" text-anchor="middle" fill="#999999" font-size="11">SQLCipher &#183; Secure Enclave</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="435" y1="110" x2="465" y2="110" stroke="url(#edge)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 3: NER + Semantic Embed -->
    <g transform="translate(470,60)">
      <rect x="0" y="0" width="200" height="100" rx="12" ry="12" fill="#131313" stroke="#3D8060" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" fill="#7AFFC1" font-size="11" letter-spacing="1.5">03 &#183; EMBED</text>
      <text x="100" y="56" text-anchor="middle" font-weight="600" font-size="15">NER + Semantic Embed</text>
      <text x="100" y="78" text-anchor="middle" fill="#999999" font-size="11">Arctic Embed S &#183; on-device</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="675" y1="110" x2="705" y2="110" stroke="url(#edge)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 4: Recall UI -->
    <g transform="translate(710,60)">
      <rect x="0" y="0" width="170" height="100" rx="12" ry="12" fill="#131313" stroke="#7AFFC1" stroke-width="2" filter="url(#glow)"/>
      <text x="85" y="28" text-anchor="middle" fill="#7AFFC1" font-size="11" letter-spacing="1.5">04 &#183; RECALL</text>
      <text x="85" y="56" text-anchor="middle" font-weight="600" font-size="15">Recall UI</text>
      <text x="85" y="78" text-anchor="middle" fill="#999999" font-size="11">Timeline &#183; Search &#183; MCP</text>
    </g>

    <!-- Bottom caption: on-device rail -->
    <g transform="translate(0,190)">
      <line x1="60" y1="0" x2="840" y2="0" stroke="#1F1F1F" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="450" y="14" text-anchor="middle" fill="#666666" font-size="11" letter-spacing="1.5">
        ALL STAGES RUN ON YOUR MAC &#183; ZERO NETWORK
      </text>
    </g>
  </g>
</svg>

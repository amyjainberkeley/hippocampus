[package]
name                   = "hippocampus-native-host"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "Native messaging host for the Hippocampus browser extension. Reads JSON from the browser, applies secret filtering + denylist, and forwards PageContentEvent frames to the MCI agent via a UNIX domain socket."

[[bin]]
name = "hippocampus-native-host"
path = "src/main.rs"

[dependencies]
mci-core = { path = "../../core" }
regex     = "1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package]
name                   = "mci-agent"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI macOS menu-bar / system-tray agent shell. Supervises the capture helper, owns the per-device id, runs the IPC select! loop. See docs/decisions/0007-macos-capture-separate-signed-helper-process.md."

[[bin]]
name = "mci-agent"
path = "src/bin/mci_agent.rs"

# DEMO-ONLY: synthetic-event seeder for the encrypted brain. Used to
# unblock the recall-UI and `mci-agent mcp-serve` demos while the
# P3.6.7 helper-side `.allow` → OCREvent fix is in flight. See the
# module docs at `src/bin/mci_seed_brain.rs` and `docs/STATE.md`
# Path B. Writes hand-authored Events with app_bundle_id in the
# `com.mci.demo.seed.*` namespace; refuses to overwrite a non-empty
# brain unless `--force` is passed.
[[bin]]
name = "mci-seed-brain"
path = "src/bin/mci_seed_brain.rs"

# P3.10a — read-only CLI for the encrypted brain store. ADR-0016 §6
# + ADR-0019 "Tier 1": "your brain as a file you own." Opens via
# SqlCipherBrainStore::open_readonly (SQLITE_OPEN_READ_ONLY pin from
# PR #82 P3.9b). Subcommands: stats, recent, search, show, export.
# No new third-party crates (same serde + serde_json already on the
# workspace lockfile). CSO invariant: read-only handle ONLY.
[[bin]]
# Maintainer tool, not shipped to users: runs the LongMemEval retrieval
# benchmark against the real store, retriever and embedder. Kept out of
# `mci-agent` so the benchmark's dataset parsing adds no weight to the
# binary people install.
name = "mci-bench"
path = "src/bin/mci_bench.rs"

[[bin]]
name = "mci-brain"
path = "src/bin/mci_brain.rs"

# DEMO / SMOKE-TEST ONLY: synthetic-brief inserter. Used to populate the
# `briefs` table with a hand-authored row so the Recall UI's Brief tab
# can be exercised before the Qwen3 brief-author pipeline lands the
# real generation path (ADR-0028, `docs/design/brief-viewer-spec.md`
# §"manual smoke"). Refuses to overwrite a date_local that already has
# a brief unless `--force` is passed.
[[bin]]
name = "mci-seed-brief"
path = "src/bin/mci_seed_brief.rs"

[lints]
workspace = true

[dependencies]
mci-core    = { path = "../../core" }
# Phase 3 P3.6.6 + P3.10b — the agent shell is both the wire-to-brain
# ingest pump (P3.6.6) and the read-only MCP server (P3.10b) that exposes
# `SqlCipherBrainStore` + `EventRecord` + `BrainStats`. mci-brain is a
# workspace path dep (no net-new third-party crate; ADR-0008 dependency-
# addition gate not triggered). The `stubs` feature is NEVER enabled on
# this dep (production binary path); test-side stub access lives in
# [dev-dependencies] below.
mci-brain   = { path = "../../core/brain" }
# ADR-0028 brief author scaffold — pure-Rust traits + lifecycle
# state machine. Already on the workspace lockfile via `mci-brief-ffi`,
# so listing it here adds ZERO net new third-party crates per ADR-0008.
mci-brief   = { path = "../../core/brief" }
# V2-MCP-2 — HTTP+SSE MCP-client core, loopback-only per ADR-0001
# amendment 2026-05-31. The agent reads `~/Library/Application
# Support/MCI/mcp-servers.toml` on start, builds a `ServerRegistry`,
# and holds it for the rest of the process so V2-MCP-3 aggregation
# (cycle 8.30, Director-Brain) can consume it without a re-init. Zero
# net-new third-party crates: hyper / tokio / serde / toml are
# already on the workspace lockfile via this package.
mci-mcp-client = { path = "../../core/mcp-client" }
tokio       = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "io-util", "io-std", "process", "signal", "fs", "net"] }
tracing     = { version = "0.1", default-features = false, features = ["std"] }
thiserror   = "1"
# JSON-RPC 2.0 framing for the P3.10b MCP server. `serde` + `serde_json`
# are already on the workspace lockfile (via `mci-brain-ffi`), so listing
# them here adds ZERO net new third-party crates per ADR-0008's
# dependency-addition gate. CSO sign-off on P3.10b asserts this.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
getrandom   = "0.3.4"   # key generation for `init`; same crate mci-core uses
# P3.8 — idle-batch embedder. macOS-only (Core ML / ANE backend for
# arctic-embed-s). On non-macOS this crate compiles to an empty lib,
# so the workspace stays green. No net-new third-party crate (objc2
# family already on the lockfile from P3.3).
[target.'cfg(target_os = "macos")'.dependencies]
mci-embed-coreml = { path = "../../adapters/macos/mci-embed-coreml" }
# ADR-0033 (Path A) / ADR-0028 — macOS Core ML bridge: generic
# CoreMLModel wrapper + the Qwen3-1.7B brief-author shim (and, V2-P5+,
# the GLiNER NER shim). macOS-only: the crate compiles to an empty lib
# elsewhere. No net-new third-party crate (objc2 family already on the
# lockfile from P3.3). Renamed from mci-llama-coreml.
mci-coreml-bridge = { path = "../../adapters/macos/mci-coreml-bridge" }
# V2-P8b — Mail.app emlx read path (PR #243). macOS-only: the crate
# compiles to an empty lib elsewhere. apps/agent consumes the READ
# surface (read_message / watch_inbox) inside `mail_ingest.rs`; no
# new third-party crate is added at the agent boundary (mail-parser
# / plist / rusqlite / notify / tokio enter only via the
# mci-mail-reader path, which already shipped them on the workspace
# lockfile via PR #243).
mci-mail-reader  = { path = "../../adapters/macos/mci-mail-reader" }
# V2-P10 — Messages.app chat.db read path (PR #248). macOS-only: the
# crate compiles to an empty lib elsewhere. apps/agent consumes the
# READ surface (list_recent_messages / read_thread / watch_inbox)
# inside `messages_ingest.rs`; no new third-party crate is added at
# the agent boundary (rusqlite / notify / tokio already on the
# workspace lockfile via PRs #82 + #243).
mci-messages-reader = { path = "../../adapters/macos/mci-messages-reader" }

# V2-P10 — `rustix::process::getuid()` for the user-allowlist file-
# permission gate (the `mode & 0o077` + `owner uid` check that mirrors
# the Swift helper's `UserAllowlistTOMLLoader.validatePermissions`).
# `rustix` is already a `mci-core` dep + on the workspace lockfile;
# this listing adds the `process` feature (uid query) without a
# net-new third-party crate per ADR-0008. The `#![forbid(unsafe_code)]`
# crate-level lint in `apps/agent/src/lib.rs` forbids a raw
# `unsafe { libc::getuid() }` — rustix provides a safe wrapper.

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }

# Deliberately NO `tracing-subscriber`: the typed HealthLogRecord
# serializer in `health_log.rs` keeps the JSON shape fixed at the
# struct level (CSO sign-off). A `tracing::info!` macro-based path
# accepts arbitrary `key=value` pairs, which is exactly the
# user-content-could-leak surface ADR-0012 §6 forbids. Direct
# tokio::fs write is also smaller dep-graph-wise.

[dev-dependencies]
tempfile    = "3"
tokio       = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "io-util", "process", "signal", "fs", "test-util"] }
# P3.6.6 — tests inject stub `BrainStore` / `Embedder` impls from
# `mci_brain::stubs`. Production agent never enables this feature; it
# is dev-only by Cargo's [dev-dependencies] gate.
mci-brain   = { path = "../../core/brain", features = ["stubs"] }

# V2-MCP-3 — `mcp_aggregator_wiring.rs` integration test spins up a
# loopback HTTP+SSE stub MCP server (shared via `#[path]` from
# `core/mcp-client/tests/stub_server.rs`) to drive the aggregator
# end-to-end. The server-side hyper/http stack is dev-only — the
# production agent never opens a listening socket. Every crate below
# is ALREADY on the workspace lockfile via `mci-mcp-client` (client
# side) + `mci-server` (axum server), so this adds ZERO net new
# third-party crates per ADR-0008.
hyper          = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util     = { version = "0.1", default-features = false, features = ["tokio"] }
http           = "1"
http-body-util = "0.1"
bytes          = "1"

# V2-P8b — tests in `mail_ingest.rs` exercise the typed-header
# translator (`to_parsed_headers`) by re-parsing synthesized emlx
# fixtures via `mail_parser::MessageParser`. Already on the lockfile
# via the V2-P8a `mci-mail-reader` macOS-target dep; listed in
# dev-dependencies so non-macOS workspace `cargo test --workspace`
# does not pick it up.
#
# V2-P10 — `messages_ingest.rs` tests synthesize a fixture chat.db
# via `rusqlite::Connection::open` + `execute_batch`. Already on the
# workspace lockfile via `mci-core` / `mci-brain`; listed here so
# `cargo test -p mci-agent` picks it up without re-vendoring SQLCipher.
# Tests use the bundled-vanilla `bundled` feature (NOT
# `bundled-sqlcipher-vendored-openssl`) — the fixture chat.db is
# plaintext SQLite mirroring Apple's on-disk shape.
[target.'cfg(target_os = "macos")'.dev-dependencies]
mail-parser = "0.11"
rusqlite = { version = "0.39.0", features = ["bundled"] }

[package]
name                   = "mci-ner-bakeoff"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "V2-P5+ Phase-3 screen-text NER bake-off harness: runs each Core ML NER candidate through the production tokenizer -> inference -> BIO-decoder path, emits scorer-format predictions, and measures compute-unit residency + footprint."

[lints]
workspace = true

[[bin]]
name = "mci-ner-bakeoff"
path = "src/main.rs"

# macOS-only: Core ML inference lives below the adapter seam
# (mci-coreml-bridge); the pure-Rust WordPiece tokenizer + BIO decoder come
# from the brain crate (mci-brain::extraction::tier2_ner). Both are already on
# the workspace lockfile, so this adds ZERO new third-party crates (no ADR-0008
# dep-addition gate). Gated `cfg(target_os = "macos")` so a non-macOS
# `cargo build --workspace` compiles `main.rs` to a no-op (the real body is
# behind the same cfg). `libc` (getrusage(2) for CPU-time sampling) is a
# transitive rusqlite dep already present — listing it adds no lockfile entry.
[target.'cfg(target_os = "macos")'.dependencies]
mci-coreml-bridge = { path = "../../adapters/macos/mci-coreml-bridge" }
mci-brain         = { path = "../../core/brain" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
libc              = "0.2"

[package]
name                   = "mci-brain"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI brain — OS-free traits + types for OCR / embed / chunk / retrieve / index. Phase 3 fills these with production impls."

[lints]
workspace = true

[features]
# Test-only stub impls (NoopChunker, FixedDimEmbedder, InMemoryBrainStore,
# StubRetriever). Always available under `cfg(test)`; the explicit feature
# exists for downstream integration-test crates that cannot see this
# crate's `cfg(test)`. Never enabled in a release build of any binary.
# Mirrors the pattern of `mci-core`'s `insecure-test-keywrap` feature, but
# carries no protected-set risk — these stubs touch no crypto / sync / store
# surface (the production impls land in the Phase 3 PR sequence per
# `docs/decisions/0010-event-episode-retrieval-unit-cc-fusion.md` and
# `docs/decisions/0011-embedding-model-snowflake-arctic-embed-s.md`).
stubs = []

[dependencies]
mci-core  = { path = ".." }
thiserror = "1"
# `rusqlite` is already on the workspace lockfile via `mci-core` with the
# same feature set (`bundled-sqlcipher-vendored-openssl`). Listing it here
# does NOT add a new third-party crate to the lockfile — Cargo unifies the
# version + features across the workspace, so both crates link a SINGLE
# `SQLCipher` binary. P3.2's CSO sign-off block asserts this. The
# `bundled-sqlcipher-vendored-openssl` feature is binding per ADR-0008 —
# no plaintext `SQLite` fallback path; the store refuses to open an
# unencrypted DB.
rusqlite  = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
# Tests exercise the stub impls; gate them via the `stubs` feature on this
# crate so the public surface is identical to the prod build path.
mci-brain = { path = ".", features = ["stubs"] }
# Test-only access to mci-core's `InMemoryKeyWrap` for spinning up an
# ephemeral `SQLCipher` db under a test key. Mirrors the gate mci-core
# uses for its own store-open tests (see `core/src/store/open.rs`
# `#[cfg(test)]` block).
mci-core  = { path = "..", features = ["insecure-test-keywrap"] }
# tempfile is already on the workspace lockfile via `mci-core`'s
# dev-dependencies. Re-listing it here does NOT add a new lockfile entry.
tempfile  = "3.27.0"
# criterion for the hybrid_recall benchmark harness. Dev-only; never in a
# release binary. Adds transitive deps to the lockfile but they are all
# build/test-time. See PR body for ADR-0008 §1 dependency note.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "hybrid_recall"
harness = false

[package]
name                   = "mci-brain"
version                = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true
description            = "MCI brain — OS-free traits + types for OCR / embed / chunk / retrieve / index. Phase 3 fills these with production impls."

[lints]
workspace = true

[features]
# Test-only stub impls (NoopChunker, FixedDimEmbedder, InMemoryBrainStore,
# StubRetriever). Always available under `cfg(test)`; the explicit feature
# exists for downstream integration-test crates that cannot see this
# crate's `cfg(test)`. Never enabled in a release build of any binary.
# Mirrors the pattern of `mci-core`'s `insecure-test-keywrap` feature, but
# carries no protected-set risk — these stubs touch no crypto / sync / store
# surface (the production impls land in the Phase 3 PR sequence per
# `docs/decisions/0010-event-episode-retrieval-unit-cc-fusion.md` and
# `docs/decisions/0011-embedding-model-snowflake-arctic-embed-s.md`).
stubs = []

[dependencies]
mci-core  = { path = ".." }
thiserror = "1"
# `rusqlite` is already on the workspace lockfile via `mci-core` with the
# same feature set (`bundled-sqlcipher-vendored-openssl`). Listing it here
# does NOT add a new third-party crate to the lockfile — Cargo unifies the
# version + features across the workspace, so both crates link a SINGLE
# `SQLCipher` binary. P3.2's CSO sign-off block asserts this. The
# `bundled-sqlcipher-vendored-openssl` feature is binding per ADR-0008 —
# no plaintext `SQLite` fallback path; the store refuses to open an
# unencrypted DB.
rusqlite  = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
# `regex` is already on the workspace lockfile via the
# `hippocampus-native-host` crate (same major). Cargo unifies the version
# across the workspace; listing it here does NOT add a new third-party
# crate to the lockfile. Used by `redaction::sms_otp` (ADR-0030 §3(a))
# and `redaction::sensitive_domains` (ADR-0030 §3(b) URL patterns).
regex     = "1"
# `toml` parses `docs/research/sensitive-domains.toml` baked in via
# `include_str!()` at compile time per ADR-0030 §3(b). New workspace dep
# — pure-Rust, no network, no plugin loading, no `unsafe`. Read-only at
# crate-init time; the parsed table is materialized into a
# `std::sync::OnceLock<…>` (MSRV 1.83 — std-only, no extra crate) and
# never re-read. CSO §5 sign-off in the PR body covers this addition.
toml      = "0.8"
# `serde` is already on the workspace lockfile (transitive via several
# adapters). The `derive` feature is needed for the `RawTable` /
# `RawBank` / `RawUrlPattern` structs that hold the parsed TOML shape.
serde     = { version = "1", features = ["derive"] }
# `sha2` is already on the workspace lockfile (transitive via the
# `bundled-sqlcipher-vendored-openssl` chain in `mci-core`). Listing
# it here does NOT add a new third-party crate — Cargo unifies the
# version across the workspace. Used by `graph::derive_ulid` to mint
# the content-stable ULIDs that key the V2-P3 graph tables; the choice
# of SHA-256 (vs. a faster non-cryptographic hash) is deliberate so
# the Phase 8 sync model (ADR-0023) can rely on cross-device
# collision resistance without a separate audit. Pure-Rust, no
# `unsafe`, no network. CSO §5 sign-off block in the PR body covers
# this addition.
sha2      = "0.10"
# `tokenizers` is already on the workspace lockfile (v0.20.4) via the
# macOS adapters `mci-embed-coreml` and `mci-coreml-bridge`, pinned with
# the SAME `{ default-features = false, features = ["onig"] }` shape.
# Listing it here does NOT add a new third-party crate to the lockfile —
# Cargo unifies the version + features across the workspace. Used by
# `extraction::tier2_ner::tokenizer` as the Rust-side WordPiece tokenizer
# (with offset mapping) for the V2-P5+ supervised NER model
# (`dslim/distilbert-NER`, bert-base-cased). Pure-Rust at our call sites
# (no Core ML, no `unsafe`); the `onig` feature pulls Oniguruma (C) but
# the BERT WordPiece path does not exercise it — onig is already in the
# tree via the adapters regardless. ADR-0008 dep-gate satisfied (reuse,
# not new). CSO §5 sign-off note in the PR body covers this addition:
# post-capture, pure-Rust text tokenization, no sensitive-capture surface.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[dev-dependencies]
# `serde_json` is already on the workspace lockfile (v1.0.149, transitive
# via several adapters + `toml`'s sibling). Dev-only here: the
# `extraction::tier2_ner` golden tests parse the committed
# `fixtures/distilbert_ner_golden.json` reference dump and the bundled
# `resources/config.json` (to pin the decoder's `id2label` ordering
# against the real model config). No runtime JSON parsing on any hot
# path — the production decoder uses a compile-time `id2label` constant
# that the test asserts equals the model config.
serde_json = "1"
# Tests exercise the stub impls; gate them via the `stubs` feature on this
# crate so the public surface is identical to the prod build path.
mci-brain = { path = ".", features = ["stubs"] }
# Test-only access to mci-core's `InMemoryKeyWrap` for spinning up an
# ephemeral `SQLCipher` db under a test key. Mirrors the gate mci-core
# uses for its own store-open tests (see `core/src/store/open.rs`
# `#[cfg(test)]` block).
mci-core  = { path = "..", features = ["insecure-test-keywrap"] }
# tempfile is already on the workspace lockfile via `mci-core`'s
# dev-dependencies. Re-listing it here does NOT add a new lockfile entry.
tempfile  = "3.27.0"
# criterion for the hybrid_recall benchmark harness. Dev-only; never in a
# release binary. Adds transitive deps to the lockfile but they are all
# build/test-time. See PR body for ADR-0008 §1 dependency note.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "hybrid_recall"
harness = false

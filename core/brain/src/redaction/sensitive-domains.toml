# sensitive-domains.toml — seed list
#
# Per ADR-0030 §3(b): a curated list of domains whose plaintext content is
# presumed sensitive regardless of which app renders it. The OCR-time
# redaction pipeline (Phase 3, ADR-0016 + ADR-0030 follow-on PR) uses this
# file to decide whether the rendered text on a Mail or Messages frame
# touches a domain whose mere appearance is grounds for refusal.
#
# Provenance:
#   - U.S. bank entries: top institutions by assets per the FDIC's quarterly
#     "Statistics on Depository Institutions" data (`fdic.gov/resources/
#     bankers/data-tools/`). Specific URLs taken from each issuer's public
#     customer-facing primary domain.
#   - International bank entries: SWIFT BIC registry, supplemented by each
#     institution's public retail-banking domain.
#   - Auth providers: each vendor's public docs site for sign-in URLs.
#   - Password-reset / OAuth-callback URL patterns: OWASP ASVS v4 §2.5
#     password-management requirements + RFC 6749 OAuth 2.0 §4.1.2 redirect
#     conventions.
#
# Update cadence: quarterly. The CSO seat refreshes via a PR-of-this-file.
# Each refresh PR carries a CSO sign-off block asserting: no entry has been
# silently downgraded, no entry has been removed without a written rationale.
#
# Matching semantics:
#   - `domain` matches the registrable domain (eTLD+1). Subdomains match.
#     e.g., `chase.com` matches `secure01.chase.com`, `app.chase.com`, etc.
#   - `url_pattern` is a Rust-regex match against the full URL (path included).
#   - `sender_short_code` matches the SMS short-code sender on the Messages
#     capture side. When the sender matches, the entire message body is
#     treated as sensitive regardless of body regex matches.
#
# Privacy invariant: this list itself is content-free. No tokens, no PII,
# no user-specific entries. Public marketing domains only.

version = 1
last_reviewed = "2026-05-28"
last_reviewed_by = "CSO seat (ADR-0030 seed PR)"


# =============================================================================
# Password-reset URL patterns
# Source: OWASP ASVS v4.0.3 §2.5 password-management requirements; RFC 6749 §4.1.2
# =============================================================================

[[url_pattern]]
name = "Password reset path (generic)"
regex = "(?i)/(?:reset|reset-password|recover|recovery|forgot|forgot-password|account-recovery)(?:[/?]|$)"
notes = "OWASP ASVS V2.5 — password-reset URLs presumed sensitive."

[[url_pattern]]
name = "OAuth callback / authorize endpoint (generic)"
regex = "(?i)/(?:oauth(?:2)?/(?:authorize|callback|token)|callback)(?:[/?]|$)"
notes = "RFC 6749 §4.1.2 — authorize / callback endpoints carry codes."

[[url_pattern]]
name = "Email verification (generic)"
regex = "(?i)/(?:verify|verify-email|confirm|confirm-email|activate|activation)(?:[/?]|$)"
notes = "Email-verification links — code in path or query; same threat model as password reset."

[[url_pattern]]
name = "Magic link / passwordless sign-in (generic)"
regex = "(?i)/(?:magic-link|passwordless|signin-link|login-link|email-link)(?:[/?]|$)"
notes = "Magic-link URLs grant session — same sensitivity as a password."

[[url_pattern]]
name = "Banking session deep-link (generic)"
regex = "(?i)\\b(?:session|account|statement|transaction)id=[A-Za-z0-9_-]{8,}"
notes = "Long opaque session identifiers in URL query — defense-in-depth pattern."

[[url_pattern]]
name = "Apple ID account recovery / 2FA flows"
regex = "(?i)https?://(?:appleid|iforgot)\\.apple\\.com(?:/|$)"
notes = "Apple ID account-flow domains. Apple Support HT204145, HT204915."

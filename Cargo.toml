# MCI workspace root. See ADR-0005.
#
# Single Cargo workspace at the repo root. Members are added per DESIGN.md phase,
# not eagerly. Phase 0: `core/` only. Phase 1+ adds `adapters/macos/`. Etc.
#
# Edition: 2021 (ADR-0005 — maximum compatibility for the SQLCipher / objc2 /
# swift-bridge / sqlite-vec / Vision-FFI crate set).
#
# MSRV: pinned at 1.83.0 (stable at MCI Phase 0 init, 2026-05). Moves only on a
# deliberate, documented bump. `rust-toolchain.toml` at the repo root pins the
# same value so every dev + CI runner uses the same toolchain.

[workspace]
resolver = "2"
members = [
    "apps/agent",
    "apps/hippocampus-native-host",
    "core",
    "core/brain",
    "core/brief",
    "core/brief-eval",
    # Pure-Rust MCP-client core + stdio transport. V2-MCP-1 foundation
    # for the Hippocampus aggregation pipeline (V2-MCP-3) that consumes
    # third-party MCP servers (gbrain, Slack/Linear/GitHub MCPs, …).
    # OS-free per ADR-0003. Stdio transport is process-local IPC — NOT
    # network — so ADR-0001 NG3 zero-network discipline is preserved.
    # The HTTP/SSE transport (V2-MCP-2) carries the ADR-0001 amendment
    # in a separate, CSO-gated PR.
    "core/mcp-client",
    # macOS-only Rust adapter: Core ML / ANE backend for the
    # snowflake-arctic-embed-s embedder. Deps + lib body are gated by
    # `cfg(target_os = "macos")` inside the crate so `cargo build
    # --workspace` on non-macOS contributors compiles it as an empty
    # library (no dep download, no link). See
    # `adapters/macos/mci-embed-coreml/Cargo.toml`.
    "adapters/macos/mci-embed-coreml",
    # macOS-only Rust Core ML bridge: a generic CoreMLModel wrapper plus
    # per-model shims (Qwen3-1.7B brief generation; GLiNER NER, V2-P5+).
    # Renamed from mci-llama-coreml in ADR-0033 (Path A). Deps + lib body
    # gated by `cfg(target_os = "macos")`. See ADR-0018 §1.2 / ADR-0033.
    "adapters/macos/mci-coreml-bridge",
    # macOS-only Rust adapter: C-ABI FFI shim that exposes a READ-ONLY
    # view of the Phase-3 brain to the SwiftUI recall-ui app at
    # `apps/recall-ui/`. Skeleton lands at P3.9a (extern "C" surface +
    # stub bodies + Rust-side tests); P3.9b wires real readonly
    # `SqlCipherBrainStore` + `HybridRetriever`. See
    # `adapters/macos/mci-brain-ffi/Cargo.toml`.
    "adapters/macos/mci-brain-ffi",
    # macOS-only Rust adapter: Mail.app read path (emlx splitter + Envelope
    # Index SQLite reader + FSEvents watcher) for V2-P8a. READ-ONLY library
    # — no event emit, no brain write, no cascade. The cascade-equivalent
    # + ADR-0030 §3(c)(ii) parsed-header check + corpus + allowlist edit
    # ship in V2-P8b (CSO-gated). Deps + lib body gated by `cfg(target_os
    # = "macos")` so a Linux `cargo build --workspace` compiles it empty.
    # See `adapters/macos/mci-mail-reader/Cargo.toml` and
    # `docs/research/mail-envelope-schema-2026-05-29.md`.
    "adapters/macos/mci-mail-reader",
    # macOS-only Rust adapter: Messages.app read path (chat.db SQLite
    # reader + FSEvents watcher) for V2-P7. READ-ONLY library — no event
    # emit, no brain write. Pairs with `core/brain/src/redaction/messages_plugin.rs`
    # which implements the ADR-0030 §3(f) per-plugin cascade-equivalent on
    # the brain-ingest path. Deps + lib body gated by `cfg(target_os =
    # "macos")` so a Linux `cargo build --workspace` compiles it empty.
    # See `adapters/macos/mci-messages-reader/Cargo.toml` and ADR-0032.
    "adapters/macos/mci-messages-reader",
    # Windows adapter: Windows.Graphics.Capture + UIA + Media Foundation.
    # Deps + lib body gated by `cfg(target_os = "windows")` so
    # `cargo build --workspace` on macOS/Linux compiles it as an empty
    # library. Phase 8 scaffold — all methods stubbed.
    "adapters/windows",
    "server",
    "tools/perf-soak",
]

[workspace.package]
edition      = "2021"
rust-version = "1.83"
publish      = false
license      = "TBD-private"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use        = "deny"

[workspace.lints.clippy]
# Start strict; relax only when an ADR justifies it.
pedantic         = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

# mci-core's `insecure-test-keywrap` feature has a `compile_error!` gated
# on `not(debug_assertions)` (security: test-only InMemoryKeyWrap must not
# ship). mci-brain's dev-dep enables that feature for its SqlCipher
# integration tests. Cargo unifies features across test + bench profiles,
# so `cargo bench -p mci-brain` would fail without this override. Scoped
# to mci-core only — benchmark code itself runs without debug assertions.
[profile.bench.package.mci-core]
debug-assertions = true

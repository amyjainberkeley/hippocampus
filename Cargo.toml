# MCI workspace root. See ADR-0005.
#
# Single Cargo workspace at the repo root. Members are added per DESIGN.md phase,
# not eagerly. Phase 0: `core/` only. Phase 1+ adds `adapters/macos/`. Etc.
#
# Edition: 2021 (ADR-0005 — maximum compatibility for the SQLCipher / objc2 /
# swift-bridge / sqlite-vec / Vision-FFI crate set).
#
# MSRV: pinned at 1.83.0 (stable at MCI Phase 0 init, 2026-05). Moves only on a
# deliberate, documented bump. `rust-toolchain.toml` at the repo root pins the
# same value so every dev + CI runner uses the same toolchain.

[workspace]
resolver = "2"
members = [
    "apps/agent",
    "core",
    "core/brain",
    "core/brief",
    # macOS-only Rust adapter: Core ML / ANE backend for the
    # snowflake-arctic-embed-s embedder. Deps + lib body are gated by
    # `cfg(target_os = "macos")` inside the crate so `cargo build
    # --workspace` on non-macOS contributors compiles it as an empty
    # library (no dep download, no link). See
    # `adapters/macos/mci-embed-coreml/Cargo.toml`.
    "adapters/macos/mci-embed-coreml",
    # macOS-only Rust adapter: C-ABI FFI shim that exposes a READ-ONLY
    # view of the Phase-3 brain to the SwiftUI recall-ui app at
    # `apps/recall-ui/`. Skeleton lands at P3.9a (extern "C" surface +
    # stub bodies + Rust-side tests); P3.9b wires real readonly
    # `SqlCipherBrainStore` + `HybridRetriever`. See
    # `adapters/macos/mci-brain-ffi/Cargo.toml`.
    "adapters/macos/mci-brain-ffi",
    "server",
]

[workspace.package]
edition      = "2021"
rust-version = "1.83"
publish      = false
license      = "TBD-private"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use        = "deny"

[workspace.lints.clippy]
# Start strict; relax only when an ADR justifies it.
pedantic         = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

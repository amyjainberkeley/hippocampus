# Per ADR-0005. MSRV is `1.83` (set in workspace `Cargo.toml` `rust-version`).
# Channel is `stable` for now so contributors don't fight a forced toolchain
# download before CI is up. Once CI lands, pin to the exact `1.X.Y` that CI
# runs against and treat MSRV bumps as deliberate, documented changes.

[toolchain]
channel    = "stable"
components = ["rustfmt", "clippy"]
profile    = "minimal"

name: Bug report
description: Something did other than what the README or the app said it would.
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The exact command, or the click path in the app.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste output verbatim. Remove anything from your own screen memory you do not want public.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or the short SHA of main"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "15.1, Apple M2"
    validations:
      required: true

name: Publish inspected release and appcast

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact inspected draft tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type PUBLISH after inspecting the draft DMG and appcast
        required: true
        type: string

concurrency:
  group: github-pages-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: macos-14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve inspected release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          case "$IS_DRAFT" in
            true|false) echo "is_draft=$IS_DRAFT" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::$TAG is missing or returned an invalid release state"; exit 1 ;;
          esac

      - name: Download and re-verify draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p inspected public
          gh release download "$TAG" --dir inspected \
            --pattern 'Hippocampus-*.dmg' \
            --pattern 'Hippocampus-*.dmg.sha256' \
            --pattern 'appcast.xml'
          DMG="inspected/Hippocampus-${TAG#v}.dmg"
          scripts/verify-release-identity.sh --phase staged \
            --tag "$TAG" \
            --dmg "$DMG" \
            --appcast inspected/appcast.xml
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          cp inspected/appcast.xml public/appcast.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage private Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - name: Promote inspected GitHub release
        if: steps.release-state.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Deploy appcast after release promotion
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Publish inspected release and appcast

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact inspected draft tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type PUBLISH after inspecting the draft DMG and appcast
        required: true
        type: string

concurrency:
  group: github-pages-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: macos-14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install --locked --version =0.22.2 cargo-audit

      - name: Audit exact release sources
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/audit-supply-chain.py --release-tag "$RELEASE_TAG" --require-version 0.22.2 > cargo-audit-report.json

      - name: Preserve publication advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-cargo-audit
          path: cargo-audit-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve inspected release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          case "$IS_DRAFT" in
            true|false) echo "is_draft=$IS_DRAFT" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::$TAG is missing or returned an invalid release state"; exit 1 ;;
          esac

      - name: Download and re-verify draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p inspected public
          gh release download "$TAG" --dir inspected \
            --pattern 'Hippocampus-*.dmg' \
            --pattern 'Hippocampus-*.dmg.sha256' \
            --pattern 'appcast.xml'
          DMG="inspected/Hippocampus-${TAG#v}.dmg"
          scripts/verify-release-identity.sh --phase staged \
            --tag "$TAG" \
            --dmg "$DMG" \
            --appcast inspected/appcast.xml
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          cp inspected/appcast.xml public/appcast.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage private Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - name: Promote inspected GitHub release
        if: steps.release-state.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Deploy appcast after release promotion
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

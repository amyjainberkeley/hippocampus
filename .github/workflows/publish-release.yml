name: Publish inspected release

# The app's update feed is the appcast.xml of the newest published release
# (SUFeedURL .../releases/latest/download/appcast.xml), so promoting the
# inspected draft to Latest is what publishes the update. Nothing else hosts
# the feed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact inspected draft tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type PUBLISH after inspecting the draft DMG and appcast
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: macos-26
    environment:
      name: release-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install --locked --version =0.22.2 cargo-audit

      - name: Audit exact release sources
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/audit-supply-chain.py --release-tag "$RELEASE_TAG" --require-version 0.22.2 > cargo-audit-report.json

      - name: Preserve publication advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-cargo-audit
          path: cargo-audit-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve inspected release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          case "$IS_DRAFT" in
            true|false) echo "is_draft=$IS_DRAFT" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::$TAG is missing or returned an invalid release state"; exit 1 ;;
          esac

      - name: Download and re-verify draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p inspected
          gh release download "$TAG" --dir inspected \
            --pattern 'Hippocampus-*.dmg' \
            --pattern 'Hippocampus-*.dmg.sha256' \
            --pattern 'Hippocampus.dmg' \
            --pattern 'Hippocampus.dmg.sha256' \
            --pattern 'appcast.xml'
          DMG="inspected/Hippocampus-${TAG#v}.dmg"
          scripts/verify-release-identity.sh --phase staged \
            --tag "$TAG" \
            --dmg "$DMG" \
            --appcast inspected/appcast.xml
          cmp "$DMG" inspected/Hippocampus.dmg
          (cd inspected && shasum -a 256 -c Hippocampus.dmg.sha256)
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Promote inspected GitHub release
        if: steps.release-state.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Confirm installed copies now see this appcast
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          FEED="https://github.com/$REPOSITORY/releases/latest/download/appcast.xml"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --proto '=https' "$FEED" --output published-appcast.xml \
              && cmp published-appcast.xml inspected/appcast.xml; then
              echo "The update feed serves the inspected appcast: $FEED"
              exit 0
            fi
            echo "Attempt $attempt: the feed does not serve the inspected appcast yet"
            sleep 10
          done
          echo "::error::$FEED does not serve the inspected appcast. Is this release marked Latest?"
          exit 1

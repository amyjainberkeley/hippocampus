name: Swift — app packages and installer

on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'adapters/macos/**'
      - 'apps/recall-ui/**'
      - 'apps/hippocampus/**'
      - 'apps/hippocampus-native-host/**'
      - 'apps/onboarding/**'
      - 'scripts/build-installer.sh'
      - 'scripts/build-app.sh'
      - 'scripts/swift-package.sh'
      - 'scripts/stage-recall-ffi.sh'
      - '.github/workflows/swift.yml'
      - 'core/mci-brain-ffi/**'
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '**.swift'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'adapters/macos/**'
      - 'apps/recall-ui/**'
      - 'apps/hippocampus/**'
      - 'apps/hippocampus-native-host/**'
      - 'apps/onboarding/**'
      - 'scripts/build-installer.sh'
      - 'scripts/build-app.sh'
      - 'scripts/swift-package.sh'
      - 'scripts/stage-recall-ffi.sh'
      - '.github/workflows/swift.yml'
      - 'core/mci-brain-ffi/**'
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper:
    name: MCICaptureHelper tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: adapters/macos/MCICaptureHelper/.build
          key: swift-helper-${{ runner.os }}-${{ hashFiles('adapters/macos/MCICaptureHelper/Package.resolved') }}
          restore-keys: swift-helper-${{ runner.os }}-

      - run: swift test --package-path adapters/macos/MCICaptureHelper

  recall-ui:
    name: recall-ui tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo + SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/recall-ui/.build
          key: swift-recall-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/recall-ui/Package.resolved') }}
          restore-keys: swift-recall-${{ runner.os }}-

      # The wrapper builds and atomically stages the archive in SwiftPM's
      # configured search path with the same macOS minimum deployment target.
      - run: scripts/swift-package.sh test --package-path apps/recall-ui

  hippocampus:
    name: Hippocampus app tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/hippocampus/.build
          key: swift-hippocampus-${{ runner.os }}-${{ hashFiles('apps/hippocampus/Package.resolved') }}
          restore-keys: swift-hippocampus-${{ runner.os }}-

      - run: swift test --package-path apps/hippocampus

  onboarding:
    name: Onboarding tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record onboarding test environment
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/onboarding/.build
          key: swift-onboarding-${{ runner.os }}-${{ hashFiles('apps/onboarding/Package.resolved') }}
          restore-keys: swift-onboarding-${{ runner.os }}-

      - run: swift test --package-path apps/onboarding

      - name: Diagnose onboarding test failure
        if: failure()
        timeout-minutes: 2
        run: |
          test_binary="$(swift build --package-path apps/onboarding --show-bin-path)/onboardingPackageTests.xctest/Contents/MacOS/onboardingPackageTests"
          if [[ -x "$test_binary" ]]; then
            xcrun lldb --batch \
              -o 'settings set target.process.stop-on-exec false' \
              -o run -o 'thread backtrace all' -- \
              "$test_binary" \
              'OnboardingKitTests.PreparationGateTests/testFailedKeyPreparationCannotContinueButRetryCanRecover'
          fi

  installer-smoke:
    name: Installer script smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Syntax check build-installer.sh
        run: bash -n scripts/build-installer.sh

      - name: Verify prereq-missing exits non-zero
        run: |
          # build-installer.sh should fail when .app is missing
          if scripts/build-installer.sh --skip-build 2>&1; then
            echo "FAIL: expected non-zero exit when .app is absent"
            exit 1
          fi
          echo "PASS: script correctly exits non-zero when .app is missing"

  # Tagged-release DMG builds (codesign + notarize) moved to .github/workflows/release.yml

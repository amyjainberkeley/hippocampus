name: Swift — app packages and installer

on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'adapters/macos/**'
      - 'apps/recall-ui/**'
      - 'apps/hippocampus/**'
      - 'apps/hippocampus-native-host/**'
      - 'apps/onboarding/**'
      - 'apps/mind/**'
      - 'scripts/build-installer.sh'
      - 'scripts/installer-requirements.txt'
      - 'scripts/test-installer*'
      - 'scripts/lib/installer-runtime.sh'
      - 'scripts/lib/atomic-bundle-swap.swift'
      - 'scripts/lib/test_atomic_bundle_swap.py'
      - 'assets/installer/**'
      - 'assets/branding/**'
      - 'scripts/build-app.sh'
      - 'scripts/swift-package.sh'
      - 'scripts/stage-recall-ffi.sh'
      - '.github/workflows/swift.yml'
      - 'core/mci-brain-ffi/**'
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '**.swift'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'adapters/macos/**'
      - 'apps/recall-ui/**'
      - 'apps/hippocampus/**'
      - 'apps/hippocampus-native-host/**'
      - 'apps/onboarding/**'
      - 'apps/mind/**'
      - 'scripts/build-installer.sh'
      - 'scripts/installer-requirements.txt'
      - 'scripts/test-installer*'
      - 'scripts/lib/installer-runtime.sh'
      - 'scripts/lib/atomic-bundle-swap.swift'
      - 'scripts/lib/test_atomic_bundle_swap.py'
      - 'assets/installer/**'
      - 'assets/branding/**'
      - 'scripts/build-app.sh'
      - 'scripts/swift-package.sh'
      - 'scripts/stage-recall-ffi.sh'
      - '.github/workflows/swift.yml'
      - 'core/mci-brain-ffi/**'
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The app needs the macOS 26 SDK and Swift 6.2 or later (Xcode 16.4 rejects
# it), so every job runs on macOS 26 with Xcode 26.6, the toolchain the app
# is released with. Caches are keyed on it so no older build is restored.
env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  helper:
    name: MCICaptureHelper tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Record OCR test environment
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          uname -m
          sysctl hw.model hw.physicalcpu hw.logicalcpu hw.memsize kern.hv_vmm_present

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: adapters/macos/MCICaptureHelper/.build
          key: swift-helper-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('adapters/macos/MCICaptureHelper/Package.resolved') }}
          restore-keys: swift-helper-${{ runner.os }}-${{ env.XCODE_APP }}-

      - run: swift test --package-path adapters/macos/MCICaptureHelper

      # Preserve the failed gate above. A fresh process excludes background
      # framework work from other suites and late, quarantined OCR requests.
      - name: Diagnose isolated accurate OCR compute devices
        if: failure()
        timeout-minutes: 3
        run: |
          diagnostic_home="$(mktemp -d "$RUNNER_TEMP/ocr-diagnostic-home.XXXXXX")"
          trap 'rm -rf -- "$diagnostic_home"' EXIT
          env -i HOME="$diagnostic_home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$(xcode-select -p)" \
            swift test --package-path adapters/macos/MCICaptureHelper --skip-build --jobs 2 \
            --filter 'VisionOCRQualityTests/testSyntheticAccurateComputeDeviceComparison'

  recall-ui:
    name: recall-ui tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Cache cargo + SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/recall-ui/.build
          key: swift-recall-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('Cargo.lock', 'apps/recall-ui/Package.resolved') }}
          restore-keys: swift-recall-${{ runner.os }}-${{ env.XCODE_APP }}-

      # The wrapper builds and atomically stages the archive in SwiftPM's
      # configured search path with the same macOS minimum deployment target.
      - run: scripts/swift-package.sh test --package-path apps/recall-ui

  hippocampus:
    name: Hippocampus app tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/hippocampus/.build
          key: swift-hippocampus-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('apps/hippocampus/Package.resolved') }}
          restore-keys: swift-hippocampus-${{ runner.os }}-${{ env.XCODE_APP }}-

      - run: swift test --package-path apps/hippocampus

  onboarding:
    name: Onboarding tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Record onboarding test environment
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/onboarding/.build
          key: swift-onboarding-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('apps/onboarding/Package.resolved') }}
          restore-keys: swift-onboarding-${{ runner.os }}-${{ env.XCODE_APP }}-

      - run: swift test --package-path apps/onboarding

      - name: Diagnose onboarding test failure
        if: failure()
        timeout-minutes: 2
        run: |
          test_bundle="$(swift build --package-path apps/onboarding --show-bin-path)/onboardingPackageTests.xctest"
          if [[ -d "$test_bundle" ]]; then
            env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$(xcode-select -p)" \
              xcrun lldb --no-lldbinit --batch \
              -o 'settings set target.process.stop-on-exec false' \
              -o run -k 'process status' -k 'thread backtrace all' -- \
              "$(xcrun --find xctest)" "$test_bundle"
          fi

  mind:
    name: hippocampus-mind tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/mind/.build
          key: swift-mind-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('apps/mind/Package.swift') }}
          restore-keys: swift-mind-${{ runner.os }}-${{ env.XCODE_APP }}-

      - run: swift test --package-path apps/mind

      # As on a Mac without Apple's Foundation Models (macOS 14 or 15): the
      # Apple engine compiled out, the suite still passing, and the binary
      # not linking the framework.
      - name: Test without Foundation Models
        run: apps/mind/scripts/test-without-foundation-models.sh

  keyframe-codec:
    name: Keyframe codec tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - run: swift test --package-path adapters/macos/MCIKeyframeCodec
      - run: swift run --package-path adapters/macos/MCIKeyframeCodec KeyframeCodecBehavior

  installer-smoke:
    name: Installer script smoke test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Provision isolated installer build dependencies
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Installer requires Python >=3.10"'
          python3 -m venv "$RUNNER_TEMP/installer-python"
          env -i HOME="$HOME" PATH="$PATH" \
            "$RUNNER_TEMP/installer-python/bin/python" -m pip --isolated install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: -r scripts/installer-requirements.txt
          echo "INSTALLER_PYTHON=$RUNNER_TEMP/installer-python/bin/python" >>"$GITHUB_ENV"

      - name: Syntax check build-installer.sh
        run: bash -n scripts/build-installer.sh

      - name: Test headless installer layout and mount ownership
        run: |
          env -i HOME="$HOME" PATH="$PATH" "$INSTALLER_PYTHON" -B scripts/test-installer-layout.py
          env -i HOME="$HOME" PATH="$PATH" bash scripts/test-installer-runtime.sh
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash scripts/test-installer-brand-assets.sh
          env -i HOME="$HOME" PATH="$PATH" scripts/build-installer.sh --verify-assets

      - name: Test guarded bundle replacement with synthetic files
        run: env -i HOME="$RUNNER_TEMP" PATH="$PATH" TMPDIR="$RUNNER_TEMP" python3 scripts/lib/test_atomic_bundle_swap.py

      - name: Verify prereq-missing exits non-zero
        run: |
          # build-installer.sh should fail when .app is missing
          if scripts/build-installer.sh --skip-build 2>&1; then
            echo "FAIL: expected non-zero exit when .app is absent"
            exit 1
          fi
          echo "PASS: script correctly exits non-zero when .app is missing"

  # Tagged-release DMG builds (codesign + notarize) moved to .github/workflows/release.yml

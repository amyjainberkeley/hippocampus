name: Cargo Audit — RustSec advisory scan

# Companion to .github/workflows/cargo.yml (test + clippy + fmt on macOS).
# This workflow runs `cargo audit` against the RustSec advisory DB on the
# tracked Cargo.lock files. Guards against
# known CVEs in the dep tree.
#
# Runs on ubuntu-latest (1× GH Actions multiplier vs 10× for macOS) —
# `cargo audit` is a pure-Rust lockfile check, no platform-specific
# behavior needed.
#
# Started as `--deny warnings` (every advisory blocks the PR). Ratchet
# down to a specific ignore list only if we hit a persistent
# unactionable advisory. Tracking origin: cycle 8.38 security-signal
# scan (PR #38) CSO recommendation #3.

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/audit-supply-chain.py'
      - 'scripts/test_supply_chain_audit.py'
      - 'scripts/check.sh'
      - '.github/workflows/cargo-audit.yml'
  pull_request:
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/audit-supply-chain.py'
      - 'scripts/test_supply_chain_audit.py'
      - 'scripts/check.sh'
      - '.github/workflows/cargo-audit.yml'
  # Weekly re-scan even without code changes — advisory DB updates land
  # in RustSec independently of our commits.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: cargo-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test audit gate failure and coverage behavior
        run: python3 -B scripts/test_supply_chain_audit.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install --locked --version =0.22.2 cargo-audit

      - name: Cache RustSec advisory DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ github.run_id }}
          restore-keys: cargo-advisory-db-

      # The shared gate keeps the existing paste no-patch waiver explicit.
      # anyhow has a patch (>=1.0.103) and must no longer be suppressed.
      # The report and exit code come from the same scan of each lockfile.
      - name: Audit all tracked Cargo lockfiles and emit JSON evidence
        run: python3 scripts/audit-supply-chain.py --require-version 0.22.2 > cargo-audit-report.json

      - name: Upload JSON report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          if-no-files-found: error
          retention-days: 30

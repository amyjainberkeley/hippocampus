name: Cargo Audit — RustSec advisory scan

# Companion to .github/workflows/cargo.yml (test + clippy + fmt on macOS).
# This workflow runs `cargo audit` against the RustSec advisory DB on the
# workspace Cargo.lock (~266 crates as of cycle 8.38). Guards against
# known CVEs in the dep tree.
#
# Runs on ubuntu-latest (1× GH Actions multiplier vs 10× for macOS) —
# `cargo audit` is a pure-Rust lockfile check, no platform-specific
# behavior needed.
#
# Started as `--deny warnings` (every advisory blocks the PR). Ratchet
# down to a specific ignore list only if we hit a persistent
# unactionable advisory. Tracking origin: cycle 8.38 security-signal
# scan (PR #38) CSO recommendation #3.

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-audit.yml'
  pull_request:
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-audit.yml'
  # Weekly re-scan even without code changes — advisory DB updates land
  # in RustSec independently of our commits.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: cargo-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}-v1

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit

      - name: Cache RustSec advisory DB
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ github.run_id }}
          restore-keys: cargo-advisory-db-

      # Two warnings currently ignored because no upstream fix exists as
      # of 2026-07-12 (revisit each cycle 8.41+):
      #   RUSTSEC-2024-0436 paste — crate unmaintained since 2024-10-07;
      #     tracked upstream (no successor drop-in); low blast radius.
      #   RUSTSEC-2026-0190 anyhow — Error::downcast_mut() unsoundness;
      #     patch pending upstream (see anyhow issue tracker).
      # Every vulnerability + high-severity finding still blocks the PR.
      - name: Run cargo audit (deny warnings, ignore tracked-no-fix)
        run: |
          cargo audit \
            --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0190

      - name: Emit JSON report for post-hoc analysis
        if: always()
        run: cargo audit --json > cargo-audit-report.json || true

      - name: Upload JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          retention-days: 30

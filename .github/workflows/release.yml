name: Release — signed DMG + notarization

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign, notarize, release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            apps/hippocampus/.build
            adapters/macos/MCICaptureHelper/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('apps/hippocampus/Package.resolved', 'adapters/macos/MCICaptureHelper/Package.resolved') }}
          restore-keys: swift-release-${{ runner.os }}-

      - name: Build all binaries
        run: |
          swift build -c release --package-path apps/hippocampus
          swift build -c release --package-path adapters/macos/MCICaptureHelper
          cargo build --workspace --release

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Store notarytool credentials
        if: env.NOTARYTOOL_APPLE_ID != ''
        env:
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notarytool-profile \
              --apple-id "$NOTARYTOOL_APPLE_ID" \
              --team-id "$NOTARYTOOL_TEAM_ID" \
              --password "$NOTARYTOOL_PASSWORD"

      - name: Detect Developer ID
        id: detect-identity
        run: |
          DEVID=$(security find-identity -v -p codesigning | \
              grep "Developer ID Application" | \
              head -1 | \
              sed 's/.*"\(.*\)"/\1/' || true)
          echo "developer_id=$DEVID" >> "$GITHUB_OUTPUT"
          if [[ -n "$DEVID" ]]; then
            echo "Found Developer ID: $DEVID"
          else
            echo "No Developer ID — DMG will be ad-hoc signed"
          fi

      - name: Build DMG
        env:
          DEVELOPER_ID: ${{ steps.detect-identity.outputs.developer_id }}
        run: scripts/build-installer.sh --skip-build

      - name: Verify DMG
        run: |
          DMG=$(ls dist/Hippocampus-*.dmg | head -1)
          cd dist && shasum -a 256 -c "$(basename "$DMG").sha256" && cd ..

          MOUNT=$(hdiutil attach "$DMG" -nobrowse | grep "/Volumes/" | sed 's/.*\/Volumes/\/Volumes/')
          MOUNT=$(echo "$MOUNT" | xargs)
          echo "--- DMG contents ---"
          ls -la "$MOUNT/"
          test -d "$MOUNT/Hippocampus.app"
          test -L "$MOUNT/Applications"

          if [[ -n "${{ steps.detect-identity.outputs.developer_id }}" ]]; then
            echo "--- Signature check ---"
            codesign --verify --deep --strict "$MOUNT/Hippocampus.app"
            echo "Signature valid."
          fi

          hdiutil detach "$MOUNT" -quiet

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # `secrets` is not a valid context in a step-level `if:`. Using it
      # makes the whole workflow file invalid, so every push failed
      # instantly with "workflow file issue" even though this workflow
      # only triggers on tags. Map the secret into `env` and test that,
      # which is what the signing and notarization steps above already do.
      - name: Map Sparkle key for conditional steps
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SPARKLE_PRIVATE_KEY not set — skipping appcast publish."
          fi

      - name: Publish appcast
        if: steps.sparkle.outputs.present == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          scripts/publish-appcast.sh --hosting-mode ghpages

      - name: Deploy appcast to GitHub Pages
        if: steps.sparkle.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls dist/Hippocampus-*.dmg | head -1)
          WORK=$(mktemp -d)

          # Clone or init the appcast repo gh-pages branch
          if git ls-remote --exit-code "https://github.com/${{ github.repository_owner }}/hippocampus-appcast.git" refs/heads/gh-pages &>/dev/null; then
            git clone --branch gh-pages --single-branch --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/hippocampus-appcast.git" \
              "$WORK"
          else
            echo "WARNING: hippocampus-appcast repo or gh-pages branch not found — skipping deploy."
            echo "  Create the repo and branch per docs/appcast-hosting.md Option A."
            exit 0
          fi

          cp dist/appcast.xml "$WORK/"
          cp "$DMG" "$WORK/"

          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No appcast changes."; exit 0; }
          git commit -m "release: Hippocampus ${{ steps.version.outputs.tag }}"
          git push origin gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hippocampus ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/Hippocampus-*.dmg
            dist/Hippocampus-*.dmg.sha256
            dist/appcast.xml

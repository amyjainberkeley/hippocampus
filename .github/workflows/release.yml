name: Release draft - signed DMG and notarization

on:
  push:
    tags: ['v*']

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The app needs the macOS 26 SDK; Xcode 26.6 is the toolchain the app is
# released with.
env:
  XCODE_APP: /Applications/Xcode_26.6.app
  # The Developer ID team every release is signed by; install.sh checks it too.
  RELEASE_TEAM_ID: BV6KGKFKP4

jobs:
  # Hippocampus is released from a Mac with scripts/release-0.3.0.sh, and this
  # repository may have no release secrets at all. Then a tag would start a
  # build that can only fail. This job runs in the signing environment, so it
  # sees the same secrets, and lets the build run only when at least one is
  # set; the build's own gate then requires all six.
  release-secrets:
    name: Check that CI releasing is set up
    runs-on: ubuntu-latest
    environment:
      name: release-signing
    permissions: {}
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - name: Look for release secrets
        id: secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          configured=false
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD NOTARYTOOL_APPLE_ID \
              NOTARYTOOL_TEAM_ID NOTARYTOOL_PASSWORD SPARKLE_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then
              configured=true
            fi
          done
          if [ "$configured" = false ]; then
            echo "::notice title=Nothing was built::No release secret is set, so this tag builds nothing here. Releases are built, signed and notarized on a Mac with scripts/release-0.3.0.sh. To release from CI instead, set all six release secrets."
          fi
          echo "configured=$configured" >>"$GITHUB_OUTPUT"

  build-draft:
    name: Build, verify, and stage owner-inspectable draft
    needs: release-secrets
    if: needs.release-secrets.outputs.configured == 'true'
    runs-on: macos-26
    environment:
      name: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Provision isolated installer build dependencies
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Installer requires Python >=3.10"'
          python3 -m venv "$RUNNER_TEMP/installer-python"
          env -i HOME="$HOME" PATH="$PATH" \
            "$RUNNER_TEMP/installer-python/bin/python" -m pip --isolated install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: -r scripts/installer-requirements.txt
          echo "INSTALLER_PYTHON=$RUNNER_TEMP/installer-python/bin/python" >>"$GITHUB_ENV"

      - name: Require release secrets and variables
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12" || { echo "::error::Required release secret is missing: \$APPLE_CERTIFICATE_P12"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Required release secret is missing: \$APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$NOTARYTOOL_APPLE_ID" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_APPLE_ID"; exit 1; }
          test -n "$NOTARYTOOL_TEAM_ID" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_TEAM_ID"; exit 1; }
          test -n "$NOTARYTOOL_PASSWORD" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_PASSWORD"; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Required release secret is missing: \$SPARKLE_PRIVATE_KEY"; exit 1; }

      - name: Freeze release identity
        run: scripts/verify-release-identity.sh --phase prebuild --tag "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install --locked --version =0.22.2 cargo-audit

      - name: Audit exact release sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/audit-supply-chain.py --release-tag "$RELEASE_TAG" --require-version 0.22.2 > cargo-audit-report.json

      - name: Preserve release advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cargo-audit
          path: cargo-audit-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/hippocampus/.build
            adapters/macos/MCICaptureHelper/.build
            apps/recall-ui/.build
            apps/onboarding/.build
            apps/mind/.build
          key: swift-release-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('apps/hippocampus/Package.resolved', 'adapters/macos/MCICaptureHelper/Package.resolved', 'apps/recall-ui/Package.resolved', 'apps/onboarding/Package.resolved', 'apps/mind/Package.swift') }}
          restore-keys: swift-release-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Select OCR build Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify offline OCR worker
        run: |
          python3 -m venv "$RUNNER_TEMP/ocr-python"
          env -i HOME="$HOME" PATH="$PATH" "$RUNNER_TEMP/ocr-python/bin/python" -m pip --isolated install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            --require-hashes --no-deps -r tools/ocr/requirements.txt
          env -i HOME="$HOME" PATH="$PATH" "$RUNNER_TEMP/ocr-python/bin/python" tools/ocr/prepare.py
          env -i HOME="$HOME" PATH="$PATH" "$RUNNER_TEMP/ocr-python/bin/python" -m unittest discover -s tools/ocr -v
          env -i HOME="$HOME" PATH="$PATH" "$RUNNER_TEMP/ocr-python/bin/python" tools/ocr/benchmark.py \
            --worker tools/ocr/dist/hippocampus-ocr/hippocampus-ocr

      - name: Reconstruct immutable release models
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_MODELS_URL="$(scripts/release_models_manifest.py \
            --manifest release-models.json \
            --release-version "$RELEASE_VERSION" \
            --field archive-url)"
          RELEASE_MODELS_SHA256="$(scripts/release_models_manifest.py \
            --manifest release-models.json \
            --release-version "$RELEASE_VERSION" \
            --field archive-sha256)"
          curl --fail --location --retry 3 --proto '=https' \
            "$RELEASE_MODELS_URL" --output "$RUNNER_TEMP/release-models.tar.gz"
          scripts/prepare-release-models.sh \
            --archive "$RUNNER_TEMP/release-models.tar.gz" \
            --sha256 "$RELEASE_MODELS_SHA256" \
            --output models

      - name: Verify Arctic Core ML runtime quality
        env:
          MCI_REQUIRE_COREML_QUALITY: "1"
        run: cargo test --locked -p mci-embed-coreml --test quality -- --nocapture

      - name: Build all binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --workspace --release --locked
          scripts/swift-package.sh build -c release --package-path apps/recall-ui
          scripts/swift-package.sh build -c release --package-path apps/onboarding
          scripts/swift-package.sh build -c release --package-path adapters/macos/MCICaptureHelper
          scripts/swift-package.sh build -c release --package-path apps/hippocampus
          scripts/swift-package.sh build -c release --package-path apps/mind

      - name: Strip local symbols, keeping dSYMs
        run: |
          scripts/strip-release-binaries.sh --symbols-dir "$RUNNER_TEMP/symbols" \
            apps/hippocampus/.build/release/Hippocampus \
            adapters/macos/MCICaptureHelper/.build/release/mci-capture-helper \
            target/release/mci-agent \
            target/release/hippocampus-native-host \
            apps/recall-ui/.build/release/recall-ui \
            apps/onboarding/.build/release/onboarding \
            apps/mind/.build/release/hippocampus-mind

      - name: Keep the dSYMs for reading crash reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-symbols-${{ github.ref_name }}
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          retention-days: 90

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Store notarytool credentials
        env:
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notarytool-profile \
            --apple-id "$NOTARYTOOL_APPLE_ID" \
            --team-id "$NOTARYTOOL_TEAM_ID" \
            --password "$NOTARYTOOL_PASSWORD"

      - name: Require Developer ID
        id: detect-identity
        run: |
          DEVID="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)"
          test -n "$DEVID" || { echo "::error::No valid Developer ID Application identity was imported"; exit 1; }
          echo "developer_id=$DEVID" >>"$GITHUB_OUTPUT"

      - name: Verify signing prerequisites
        run: scripts/check-signing-prereqs.sh --release

      - name: Verify Sparkle key pair
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" >"$RUNNER_TEMP/sparkle-private.key"
          scripts/verify-sparkle-keypair.sh \
            --private-key "$RUNNER_TEMP/sparkle-private.key" \
            --info-plist apps/hippocampus/Resources/Info.plist

      - name: Build signed and notarized DMG
        env:
          DEVELOPER_ID: ${{ steps.detect-identity.outputs.developer_id }}
        run: scripts/build-installer.sh

      - name: Verify signed distribution
        run: |
          DMG="dist/Hippocampus-${GITHUB_REF_NAME#v}.dmg"
          (cd dist && shasum -a 256 -c "$(basename "$DMG").sha256")
          (cd dist && shasum -a 256 -c Hippocampus.dmg.sha256)
          cmp "$DMG" dist/Hippocampus.dmg
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          # Accepted is not enough: Apple's logs must list no issues at all.
          python3 scripts/check-notary-log.py --archive "Hippocampus-${GITHUB_REF_NAME#v}-app.zip" dist/notary-app-log.json
          python3 scripts/check-notary-log.py --archive "$(basename "$DMG")" dist/notary-dmg-log.json

          MOUNT="$(hdiutil attach "$DMG" -nobrowse | sed -n 's|^.*\(/Volumes/.*\)$|\1|p' | tail -1)"
          test -n "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -d "$MOUNT/Hippocampus.app"
          test -L "$MOUNT/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Hippocampus.app"
          xcrun stapler validate "$MOUNT/Hippocampus.app"
          spctl --assess --type execute --verbose=2 "$MOUNT/Hippocampus.app"
          # hippocampus-mind weak-links FoundationModels (otool -l), every
          # binary runs on macOS 14, and syspolicy_check distribution passes.
          scripts/verify-release-app.sh --version "${GITHUB_REF_NAME#v}" --team "$RELEASE_TEAM_ID" \
            --minimum-macos 14.0 --gatekeeper distribution "$MOUNT/Hippocampus.app"
          scripts/build-provenance.py verify \
            --app "$MOUNT/Hippocampus.app" \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-digest "$(python3 scripts/product-source-digest.py --repo-root .)" \
            --forbid-current-source
          hdiutil detach "$MOUNT" -quiet
          trap - EXIT

      # The release's own appcast.xml is the app's feed once the release is
      # published as Latest (SUFeedURL .../releases/latest/download/appcast.xml).
      - name: Sign staged Sparkle appcast
        run: |
          DMG="dist/Hippocampus-${GITHUB_REF_NAME#v}.dmg"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$DMG")"
          scripts/sparkle-publish.sh \
            --dmg "$DMG" \
            --private-key "$RUNNER_TEMP/sparkle-private.key" \
            --changelog-notes \
            --download-url "$DOWNLOAD_URL" \
            --release-tag "$GITHUB_REF_NAME" \
            --appcast dist/appcast.xml \
            --dist dist \
            --no-confirm

      - name: Verify staged release identity
        run: |
          scripts/verify-release-identity.sh --phase staged \
            --tag "$GITHUB_REF_NAME" \
            --dmg "dist/Hippocampus-${GITHUB_REF_NAME#v}.dmg" \
            --appcast dist/appcast.xml

      - name: Stage the one-line installer
        # README's install line fetches releases/latest/download/install.sh;
        # the script itself verifies the DMG's checksum, team and notarization.
        run: install -m 0755 scripts/install.sh dist/install.sh

      - name: Hand verified artifacts to the credential-free draft job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Hippocampus-*.dmg
            dist/Hippocampus-*.dmg.sha256
            dist/Hippocampus.dmg
            dist/Hippocampus.dmg.sha256
            dist/install.sh
            dist/appcast.xml
            dist/notary-*.json

  create-draft:
    name: Create owner-inspectable draft
    needs: build-draft
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-${{ github.ref_name }}
          path: dist

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hippocampus ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/Hippocampus-*.dmg
            dist/Hippocampus-*.dmg.sha256
            dist/Hippocampus.dmg
            dist/Hippocampus.dmg.sha256
            dist/install.sh
            dist/appcast.xml
            dist/notary-*.json

name: Release — signed DMG + notarization

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign, notarize, release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Require release secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12" || { echo "::error::Required release secret is missing: \$APPLE_CERTIFICATE_P12"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Required release secret is missing: \$APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$NOTARYTOOL_APPLE_ID" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_APPLE_ID"; exit 1; }
          test -n "$NOTARYTOOL_TEAM_ID" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_TEAM_ID"; exit 1; }
          test -n "$NOTARYTOOL_PASSWORD" || { echo "::error::Required release secret is missing: \$NOTARYTOOL_PASSWORD"; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Required release secret is missing: \$SPARKLE_PRIVATE_KEY"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            apps/hippocampus/.build
            adapters/macos/MCICaptureHelper/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('apps/hippocampus/Package.resolved', 'adapters/macos/MCICaptureHelper/Package.resolved') }}
          restore-keys: swift-release-${{ runner.os }}-

      - name: Build all binaries
        run: |
          scripts/swift-package.sh build -c release --package-path apps/hippocampus
          scripts/swift-package.sh build -c release --package-path adapters/macos/MCICaptureHelper
          cargo build --workspace --release

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Store notarytool credentials
        env:
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notarytool-profile \
              --apple-id "$NOTARYTOOL_APPLE_ID" \
              --team-id "$NOTARYTOOL_TEAM_ID" \
              --password "$NOTARYTOOL_PASSWORD"

      - name: Require Developer ID
        id: detect-identity
        run: |
          DEVID=$(security find-identity -v -p codesigning | \
              grep "Developer ID Application" | \
              head -1 | \
              sed 's/.*"\(.*\)"/\1/' || true)
          echo "developer_id=$DEVID" >> "$GITHUB_OUTPUT"
          test -n "$DEVID" || { echo "::error::No valid Developer ID Application identity was imported"; exit 1; }
          echo "Found Developer ID: $DEVID"

      - name: Verify signing prerequisites
        run: scripts/check-signing-prereqs.sh --release

      - name: Build DMG
        env:
          DEVELOPER_ID: ${{ steps.detect-identity.outputs.developer_id }}
        run: scripts/build-installer.sh

      - name: Verify DMG
        run: |
          DMG=$(ls dist/Hippocampus-*.dmg | head -1)
          cd dist && shasum -a 256 -c "$(basename "$DMG").sha256" && cd ..

          MOUNT=$(hdiutil attach "$DMG" -nobrowse | grep "/Volumes/" | sed 's/.*\/Volumes/\/Volumes/')
          MOUNT=$(echo "$MOUNT" | xargs)
          echo "--- DMG contents ---"
          ls -la "$MOUNT/"
          test -d "$MOUNT/Hippocampus.app"
          test -L "$MOUNT/Applications"

          echo "--- Signature and notarization checks ---"
          codesign --verify --deep --strict "$MOUNT/Hippocampus.app"
          xcrun stapler validate "$MOUNT/Hippocampus.app"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$MOUNT/Hippocampus.app"
          echo "Signature and notarization tickets valid."

          hdiutil detach "$MOUNT" -quiet

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          scripts/publish-appcast.sh --hosting-mode ghpages

      - name: Deploy appcast to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls dist/Hippocampus-*.dmg | head -1)
          WORK=$(mktemp -d)

          # Clone or init the appcast repo gh-pages branch
          if git ls-remote --exit-code "https://github.com/${{ github.repository_owner }}/hippocampus-appcast.git" refs/heads/gh-pages &>/dev/null; then
            git clone --branch gh-pages --single-branch --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/hippocampus-appcast.git" \
              "$WORK"
          else
            echo "ERROR: hippocampus-appcast repo or gh-pages branch not found."
            echo "  Create the repo and branch per docs/appcast-hosting.md Option A."
            exit 1
          fi

          cp dist/appcast.xml "$WORK/"
          cp "$DMG" "$WORK/"

          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No appcast changes."; exit 0; }
          git commit -m "release: Hippocampus ${{ steps.version.outputs.tag }}"
          git push origin gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hippocampus ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/Hippocampus-*.dmg
            dist/Hippocampus-*.dmg.sha256
            dist/appcast.xml

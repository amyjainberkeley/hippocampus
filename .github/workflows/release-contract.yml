permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: scripts/test-release-contract.sh
      - run: scripts/test-toml-license-contract.sh
      - run: scripts/test-task-2-product-truth.sh
      - run: scripts/test-retention-policy-contract.sh
      - run: scripts/test-e2e-clean-home-contract.sh
      - run: scripts/e2e-clean-home.sh
      - run: scripts/test-development-app-contract.sh
      - run: scripts/test-development-file-key-contract.sh
      - run: scripts/test-no-quarantine-bypass.sh
      - run: scripts/test-verify-app-launches.sh
      - run: scripts/test-demo-contract.sh
      - run: scripts/test-keyframe-demo-fixture.sh
      - run: scripts/test-onboarding-product-truth.sh
      - run: scripts/test-screenshot-assets.sh
      - run: node --test extensions/safari/__tests__/content.test.cjs
      - run: scripts/swift-package.sh run --package-path apps/hippocampus CaptureConsentBehavior
      - run: scripts/swift-package.sh run --package-path apps/hippocampus ChildProcessEnvironmentBehavior
      - run: scripts/swift-package.sh run --package-path adapters/macos/MCICaptureHelper CaptureSourcePolicyBehavior
      - run: scripts/swift-package.sh run --package-path adapters/macos/MCICaptureHelper HelperReadinessBehavior
      - run: scripts/test-capture-overlap-corpus.sh
      - run: scripts/test-live-capture-overlap-contract.sh
      - run: scripts/swift-package.sh run --package-path apps/onboarding OnboardingRouteBehavior
      - run: apps/hippocampus/Resources/build-app.sh --debug --development-ad-hoc --development-lite
      - run: scripts/test-release-identity.sh
      - run: scripts/test-prepare-release-models.sh
      - run: scripts/test-release-model-manifest.sh
      - run: scripts/test-sparkle-keygen.sh
      - run: scripts/test-sparkle-keypair.sh

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
